<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base target="_top">
<title>Brand Astra</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: brand-black sidebar (always dark) beside a light work area; dark mode softens the work area to slate, never pure black. Cards, tables and a right-side review drawer. */
:root {
  --font: "Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --bg: #F4F6FA; --card: #FFFFFF; --card-2: #F0F3F8; --line: #E3E8F0; --line-2: #D5DCE7;
  --fg: #0B0F17; --muted: #5A6477; --faint: #8C95A6;
  --accent: #005DFF; --accent-soft: #E6EEFF; --accent-ink: #FFFFFF;
  --side: #0A0D14; --side-2: #141A26; --side-fg: #E9EDF4; --side-muted: #8D97AA; --side-line: #1D2432;
  --ok: #047A55; --ok-soft: #DFF6EE; --warn: #9A5B00; --warn-soft: #FFF1D6; --bad: #C42838; --bad-soft: #FFE5E8; --info: #0049CC; --info-soft: #E5EDFF;
  --bar-ok: #049769; --bar-warn: #E59A1A; --bar-bad: #E0475A; --bar-info: #567DE8;
  --shadow: 0 1px 2px rgba(10, 20, 40, .05), 0 6px 20px rgba(10, 20, 40, .05);
  --radius: 12px;
}
:root[data-ui="dark"] {
  --bg: #121823; --card: #1A2230; --card-2: #212A3A; --line: #2A3446; --line-2: #354154;
  --fg: #EDF1F7; --muted: #9DA7B9; --faint: #6F7A8E;
  --accent: #4D8BFF; --accent-soft: #1A2B4D; --accent-ink: #FFFFFF;
  --side: #0A0D14; --side-2: #151B27; --side-fg: #E9EDF4; --side-muted: #8D97AA; --side-line: #1F2635;
  --ok: #3FD6A6; --ok-soft: #13332B; --warn: #FFB846; --warn-soft: #35290F; --bad: #FF7A88; --bad-soft: #3A1A20; --info: #86AEFF; --info-soft: #1A2B4D;
  --bar-ok: #1DC797; --bar-warn: #F2AE3D; --bar-bad: #F2667A; --bar-info: #6E91F0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--side); }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tnum { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* Shell */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-fg); position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100dvh - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 18px; padding: 20px 14px calc(16px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); overflow-y: auto; z-index: 20; }
.brand { display: grid; gap: 12px; padding: 0 2px 4px; }
.brand .plate { padding: 4px 8px 0; display: grid; place-items: start; }
.brand .plate img { width: 150px; height: auto; display: block; filter: brightness(0) invert(1); }   /* white logo on the dark sidebar */
.brand .prod { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 8px; }
.brand .prod b { font-size: 15px; font-weight: 400; color: var(--side-fg); } .brand .prod b strong { font-weight: 700; }
.brand .prod small { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--side-muted); }
.nav { display: grid; gap: 2px; }
.nav-label { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--side-muted); padding: 8px 10px 4px; }
.nav button { appearance: none; border: 0; background: none; color: var(--side-fg); display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; cursor: pointer; text-align: left; font-weight: 500; font-size: 13.5px; opacity: .82; }
.nav button svg { width: 18px; height: 18px; flex: none; }
.nav button:hover { background: var(--side-2); opacity: 1; }
.nav button[aria-current="page"] { background: var(--side-2); opacity: 1; box-shadow: inset 3px 0 0 #1DC797; }
.nav .n { margin-left: auto; font-size: 11px; font-weight: 600; background: #1DC797; color: #00261B; border-radius: 999px; padding: 0 7px; min-width: 20px; text-align: center; }
.nav .n.muted { background: var(--side-line); color: var(--side-fg); }
.due-list { display: grid; gap: 2px; }
.due-list button { appearance: none; border: 0; background: none; color: var(--side-fg); display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 12.5px; }
.due-list button:hover { background: var(--side-2); }
.due-list .dot { width: 8px; height: 8px; border-radius: 50%; }
.due-list .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .9; }
.due-list .d { color: var(--side-muted); font-size: 11.5px; }
.side-foot { margin-top: auto; display: grid; gap: 10px; border-top: 1px solid var(--side-line); padding-top: 14px; }
.me { display: flex; align-items: center; gap: 10px; padding: 0 6px; min-width: 0; }
.me img { width: 32px; height: 32px; border-radius: 50%; flex: none; }
.me .nm { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me .rl { font-size: 11.5px; color: var(--side-muted); }
.me-acts { display: flex; gap: 10px; margin-top: 2px; }
.me-acts .linkbtn { font-size: 11px; color: var(--side-muted); padding: 0; }
.me-acts .linkbtn:hover { color: #fff; }
.lg-roles { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
.lg-access { display: grid; gap: 6px; padding: 12px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--fg); font-size: 13px; }
.lg-access[hidden] { display: none; }
.lg-access .btn { justify-self: start; }
.team-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.team-row:first-child { border-top: 0; }
.team-row img { width: 34px; height: 34px; border-radius: 50%; }
.team-row .who { min-width: 0; display: grid; }
.team-row .who b, .team-row .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team-row .who span { font-size: 12.5px; color: var(--muted); }
.palette-strip { display: flex; gap: 4px; padding: 0 6px; }
.palette-strip span { flex: 1; height: 6px; border-radius: 2px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px; padding-block: 12px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.top h1 { font-size: 18px; font-weight: 600; }
.crumb { font-size: 12px; color: var(--muted); }
.spacer { flex: 1; }
.icon-btn { appearance: none; border: 1px solid var(--line); background: var(--card); width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; cursor: pointer; color: var(--fg); flex: none; }
.icon-btn svg { width: 18px; height: 18px; }
.bell { position: relative; }
.bell .badge { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--bg); }
.bell .badge[hidden] { display: none; }
.notif-panel { position: fixed; top: 62px; right: max(16px, env(safe-area-inset-right, 0px)); width: min(390px, calc(100vw - 32px)); max-height: min(72vh, 580px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 14px 44px rgba(10, 20, 40, .2); z-index: 40; display: grid; align-content: start; }
.notif-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 1; }
.notif { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 10px; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line); text-align: left; background: none; font: inherit; color: var(--fg); cursor: pointer; width: 100%; }
.notif:hover, .notif:focus-visible { background: var(--card-2); outline: none; }
.notif.unread { background: var(--accent-soft); }
.notif b { display: block; font-size: 13px; font-weight: 600; overflow-wrap: break-word; }
.notif .small { display: block; overflow-wrap: break-word; }
.notif .when { display: block; font-size: 11px; color: var(--faint); margin-top: 2px; }
.notif i { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--faint); }
.notif i.k-ok { background: var(--ok); } .notif i.k-warn { background: var(--bar-warn); } .notif i.k-bad, .notif i.k-due { background: var(--bad); }
.notif i.k-msg { background: var(--accent); } .notif i.k-task { background: var(--info); }
.print-only { display: none; }
@media print {
  #side, .top, .demobar, .no-print, .tour-card, .toast, .scrim { display: none !important; }
  .print-only { display: block; }
  body { background: #fff; }
  .card, .table-wrap { box-shadow: none !important; break-inside: avoid; }
}
.notif-empty { padding: 28px 18px; text-align: center; color: var(--muted); font-size: 13px; }
.menu-btn { display: none; }
.view { padding-block: 22px 64px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; align-content: start; max-width: 1360px; width: 100%; }
.demobar { background: var(--accent-soft); color: var(--fg); font-size: 12.5px; }
.demobar .in { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; padding-block: 8px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; width: 272px; height: 100dvh; padding-top: calc(20px + env(safe-area-inset-top, 0px)); transform: translateX(-102%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.4); }
  .side.open { transform: none; }
  .menu-btn { display: grid; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 15; }
  .top-in, .view, .demobar .in { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top .crumb { display: none; }
}

/* Buttons & pills */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 9px; padding: 9px 15px; font-weight: 600; font-size: 13px; cursor: pointer; border: 1px solid transparent; text-decoration: none; white-space: nowrap; }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-dark { background: var(--fg); color: var(--bg); }
.btn-ghost { background: var(--card); border-color: var(--line); color: var(--fg); }
.btn-ghost:hover { background: var(--card-2); }
.btn-ok { background: var(--ok); color: var(--card); }
.btn-warn { background: var(--warn-soft); color: var(--warn); border-color: currentColor; }
.btn-bad { background: var(--bad-soft); color: var(--bad); border-color: currentColor; }
.btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.linkbtn { appearance: none; background: none; border: 0; padding: 0; color: var(--accent); font-weight: 500; cursor: pointer; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-awaiting, .st-resubmitted, .st-inreview, .rq-ontrack { color: var(--info); background: var(--info-soft); }
.st-approved { color: var(--ok); background: var(--ok-soft); }
.st-changes, .rq-soon { color: var(--warn); background: var(--warn-soft); }
.st-rejected, .rq-overdue { color: var(--bad); background: var(--bad-soft); }
.rq-closed { color: var(--muted); background: var(--card-2); }
.tag { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.late { color: var(--bad); font-weight: 600; }
.ontime { color: var(--ok); font-weight: 600; }
.muted { color: var(--muted); }
.chip { display: inline-flex; gap: 5px; align-items: center; font-size: 11.5px; padding: 2px 8px; border-radius: 6px; font-weight: 500; }
.chip.fail { background: var(--bad-soft); color: var(--bad); }
.chip.minor { background: var(--warn-soft); color: var(--warn); }
.chip.pass { background: var(--ok-soft); color: var(--ok); }

/* Cards & grids */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-head h3 { font-size: 14.5px; font-weight: 600; }
.card-head .sub { font-size: 12px; color: var(--muted); }
.page-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head h2 { font-size: 24px; font-weight: 700; }
.page-head h2 b { font-weight: 700; }
.page-head h2 span { font-weight: 400; }
.page-head p { color: var(--muted); max-width: 70ch; margin-top: 4px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid-main { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 1180px) { .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-main { grid-template-columns: minmax(0, 1fr); } .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .grid-4, .grid-3, .grid-2 { grid-template-columns: minmax(0, 1fr); } }

.kpi { display: grid; gap: 6px; }
.kpi .l { font-size: 12.5px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 8px; }
.kpi .l i { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-style: normal; }
.kpi .l i svg { width: 15px; height: 15px; }
.kpi .v { font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 14px; font-weight: 500; color: var(--muted); }
.kpi .d { font-size: 12px; color: var(--muted); }
.kpi .d b { font-weight: 600; }
.up { color: var(--ok); } .down { color: var(--bad); }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
table { width: 100%; border-collapse: collapse; min-width: 720px; }
th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 11px 14px; border-bottom: 1px solid var(--line); background: var(--card-2); white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13px; }
tr:last-child td { border-bottom: 0; }
td.tnum { white-space: nowrap; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--card-2); }
.person { display: flex; align-items: center; gap: 10px; min-width: 0; }
.person img { width: 30px; height: 30px; border-radius: 50%; flex: none; }
.person .nm { font-weight: 600; }
.small { font-size: 11.5px; color: var(--muted); }
.progress { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; min-width: 120px; }
.progress .track { height: 6px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
.progress .fill { height: 100%; border-radius: 999px; background: var(--bar-ok); }
.score { display: inline-grid; place-items: center; min-width: 40px; padding: 2px 8px; border-radius: 7px; font-weight: 700; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.score.hi { background: var(--ok-soft); color: var(--ok); }
.score.mid { background: var(--warn-soft); color: var(--warn); }
.score.lo { background: var(--bad-soft); color: var(--bad); }
.score.na { background: var(--card-2); color: var(--muted); font-weight: 500; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar .grow { flex: 1 1 220px; }
.field-in { width: 100%; border: 1px solid var(--line-2); background: var(--card); border-radius: 9px; padding: 9px 12px; }
select.field-in { width: auto; }
textarea.field-in { resize: vertical; min-height: 90px; }
.seg { display: inline-flex; background: var(--card-2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { appearance: none; border: 0; background: none; padding: 6px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: var(--shadow); font-weight: 600; }

/* Request cards (portfolio grid) */
.req-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 12px; align-items: start; overflow-x: auto; padding-bottom: 4px; }
.col { background: var(--card-2); border-radius: 12px; padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 160px; transition: outline-color .15s; outline: 2px dashed transparent; outline-offset: -2px; }
.col.over { outline-color: var(--accent); }
.col-head { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; font-weight: 600; padding: 2px 4px; }
.col-head .n { color: var(--muted); font-weight: 500; }
.col-empty { font-size: 12px; color: var(--faint); padding: 14px 6px; text-align: center; border: 1px dashed var(--line-2); border-radius: 9px; }
.tcard { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; font-size: 12.5px; box-shadow: var(--shadow); cursor: pointer; min-width: 0; }
.tcard[draggable="true"] { cursor: grab; }
.tcard.dragging { opacity: .5; }
.tcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tcard h5 { font-size: 13.5px; font-weight: 600; overflow-wrap: break-word; }
.tcard .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-width: 0; }
.prio { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; text-transform: uppercase; letter-spacing: .05em; }
.prio.high { background: var(--bad-soft); color: var(--bad); }
.prio.normal { background: var(--card-2); color: var(--muted); }
.prio.low { background: var(--info-soft); color: var(--info); }
.mini-select { font: inherit; font-size: 11.5px; padding: 3px 6px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cal .dow { background: var(--card-2); font-size: 11px; font-weight: 600; color: var(--muted); padding: 6px 8px; }
.cal .day { background: var(--card); min-height: 96px; padding: 6px; display: grid; gap: 4px; align-content: start; font-size: 11.5px; min-width: 0; }
.cal .day.out { background: var(--card-2); color: var(--faint); }
.cal .day .dn { justify-self: start; font-weight: 600; padding: 0 6px; border-radius: 999px; }
.cal .day.today .dn { background: var(--accent); color: var(--accent-ink); }
.ev { display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--accent); border-radius: 5px; padding: 3px 6px; font: inherit; font-size: 11px; font-weight: 500; background: var(--accent-soft); color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.ev.high { border-left-color: var(--bad); background: var(--bad-soft); }
.ev.low { border-left-color: var(--faint); background: var(--card-2); }
.ev.done { opacity: .55; text-decoration: line-through; }
.cal-agenda { display: none; gap: 6px; }
.agenda-row { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; align-items: center; }

.pick { display: grid; gap: 4px; max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 9px; padding: 8px; }

/* Lists */

.step.done { color: var(--muted); } .step.done i { background: var(--bar-ok); }
.step.now { color: var(--fg); font-weight: 600; } .step.now i { background: var(--bar-info); }
.step.now.warn i { background: var(--bar-warn); } .step.now.bad i { background: var(--bar-bad); }
.step.done.final { color: var(--ok); font-weight: 600; }
.ai-report { display: grid; gap: 12px; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--accent-soft), var(--card) 70px); }
.ai-head { display: flex; gap: 12px; align-items: flex-start; } .ai-head img { width: 34px; height: 34px; border-radius: 50%; flex: none; } .ai-head > div { flex: 1; }
.ai-crit { display: grid; gap: 8px; }
.ai-row { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 13px; } .ai-row .chip { justify-content: center; }
.ai-fixes ol { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 4px; font-size: 13px; }
.ai-facts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.qc-break { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.qc-break b { color: var(--fg); }
.qc-rules { display: grid; gap: 8px; }
.qc-rule { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 13px; padding: 10px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }

.chip.sev-critical { background: var(--bad); color: #fff; }

.qc-pass { font-size: 13px; }

.qc-pass .qc-group { margin-top: 8px; display: grid; gap: 4px; }
.qc-pass .qc-group > b { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.qc-ok { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; color: var(--muted); }

.sw-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.drop { border: 1.5px dashed var(--line-2); border-radius: 12px; padding: 22px 16px; display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; text-align: center; cursor: pointer; background: var(--card-2); }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop.has { flex-direction: row; justify-content: flex-start; gap: 14px; padding: 12px 14px; }
.drop-x { flex: none; align-self: flex-start; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; padding: 0; border: 1px solid var(--line-2); background: var(--card); color: var(--muted); cursor: pointer; }
.drop-x svg { width: 15px; height: 15px; }

.fix-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .fix-top b { font-size: 14px; }

.ok-note { background: var(--ok-soft); color: var(--ok); } .eye-line { margin: 0; }
.pdf-ic { width: 56px; height: 68px; border-radius: 6px; background: #E0475A; color: #fff; font-weight: 700; font-size: 13px; display: grid; place-items: center; flex: none; }
.btn svg { width: 15px; height: 15px; }
.ai-wait { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); }
.spin { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--line-2); border-top-color: var(--accent); flex: none; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.ai-note { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); } .ai-note img { width: 30px; height: 30px; border-radius: 50%; flex: none; }
.ai-card { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.approval { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--ok-soft); flex-wrap: wrap; }
.approval > div { flex: 1; min-width: 160px; } .approval b { font-size: 15px; letter-spacing: .04em; color: var(--ok); }
.ok-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--ok); color: var(--card); display: grid; place-items: center; flex: none; } .ok-dot svg { width: 16px; height: 16px; }
.thread-box { display: grid; gap: 10px; border-top: 1px dashed var(--line); padding-top: 12px; }

.thread { display: grid; gap: 10px; }

.feature-box { display: grid; gap: 8px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); }
.sc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }

.sc-card h4 { font-size: 15px; font-weight: 600; overflow-wrap: break-word; }
.feedback { background: var(--card-2); border-radius: 9px; padding: 11px 13px; font-size: 13px; display: grid; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.feed { display: grid; gap: 0; }
.feed .it { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.feed .it:last-child { border-bottom: 0; }
.feed img { width: 30px; height: 30px; border-radius: 50%; }

.empty { border: 1px dashed var(--line-2); border-radius: var(--radius); padding: 28px 20px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center; background: var(--card); }

/* Charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }

.legend span { display: inline-flex; align-items: center; gap: 6px; }

.hbar { display: grid; gap: 10px; }
.hbar .row { display: grid; grid-template-columns: 120px 1fr 44px; gap: 10px; align-items: center; font-size: 12.5px; }
.hbar .row .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { height: 10px; border-radius: 4px; background: var(--card-2); overflow: hidden; }

.tip { position: fixed; pointer-events: none; z-index: 60; background: var(--fg); color: var(--bg); font-size: 12px; padding: 7px 10px; border-radius: 7px; box-shadow: var(--shadow); white-space: nowrap; }
.tip b { font-weight: 600; }

/* Brand QC */
.qc-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
@media (max-width: 1100px) { .qc-layout { grid-template-columns: minmax(0, 1fr); } }
.formats { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }

.fmt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.fmt .art svg { max-height: 80px; max-width: 100%; width: auto; height: auto; }

.fmt span { font-size: 11px; color: var(--muted); }
.checks { display: grid; gap: 8px; }
.check { display: grid; grid-template-columns: 20px 1fr; gap: 9px; align-items: start; font-size: 13px; cursor: pointer; padding: 8px 10px; border-radius: 8px; background: var(--card-2); }

.issue { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 13px; padding: 9px 11px; border-radius: 8px; }
.issue.error { background: var(--bad-soft); } .issue.error .ic { color: var(--bad); }
.issue.warn { background: var(--warn-soft); } .issue.warn .ic { color: var(--warn); }
.issue.tip { background: var(--card-2); } .issue.tip .ic { color: var(--muted); }
.issue .ic { font-weight: 700; }

.gauge { display: grid; place-items: center; gap: 4px; padding: 6px 0; }
.gauge .num { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.gauge .cap { font-size: 12.5px; font-weight: 600; }
.ring { width: 150px; height: 150px; }

/* Scorecard */
.sc { display: grid; gap: 8px; }
.rv-body { gap: 22px; }
.rv-step { display: grid; gap: 10px; }
.rv-h { display: flex; align-items: center; gap: 10px; } .rv-h b, .rv-h label { font-size: 15px; font-weight: 700; }
.rv-n { width: 24px; height: 24px; border-radius: 50%; background: var(--fg); color: var(--card); font-size: 12px; font-weight: 700; display: grid; place-items: center; flex: none; }
.rv-meta { font-size: 13px; color: var(--muted); margin: 0; } .rv-note { font-size: 13px; margin: 0; padding: 10px 12px; border-radius: 9px; background: var(--card-2); white-space: pre-wrap; }
.rv-score { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); }
.sc-row.is-fail { box-shadow: inset 3px 0 0 var(--bad); }
.rv-groups { display: grid; gap: 8px; }
.rv-group { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.rv-group summary { cursor: pointer; font-size: 13.5px; } .rv-group summary b { font-weight: 600; }
.dlg-foot .btn.suggested { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
.sc-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 9px; background: var(--card-2); }
.sc-row b { font-size: 13px; font-weight: 600; display: block; }
.sc-row span { font-size: 11.5px; color: var(--muted); }
.sc-row .seg button[data-v="pass"][aria-pressed="true"] { color: var(--ok); }
.sc-row .seg button[data-v="minor"][aria-pressed="true"] { color: var(--warn); }
.sc-row .seg button[data-v="fail"][aria-pressed="true"] { color: var(--bad); }
.sc-row .seg { background: var(--card); }
.sc-row .seg button[aria-pressed="true"] { background: var(--card-2); box-shadow: none; }

/* Brand kit */
.kit-nav { display: flex; gap: 8px; flex-wrap: wrap; }
.kit-files { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }

.kf > div { flex: 1; display: grid; } .kf b { font-size: 13.5px; } .kf .btn { flex: none; }

.lt-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; flex-wrap: wrap; }
.lt-foot b { display: block; font-size: 13px; } .lt-foot .actions { gap: 6px; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 16px 12px; }
.sw { appearance: none; border: 0; padding: 0; background: none; text-align: left; cursor: pointer; display: grid; gap: 4px; }
.sw .c { aspect-ratio: 1.4; border-radius: 8px; display: block; max-width: 100%; box-shadow: inset 0 0 0 1px rgba(127,127,127,.25); }
.sw .nm { font-size: 12.5px; font-weight: 600; }
.sw .hx { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sw .use { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.pal-note { font-size: 13px; color: var(--muted); max-width: 72ch; margin-top: -4px; }
.prod-pal { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px 36px; }
.pp { display: grid; gap: 10px; align-content: start; }
.pp-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.pp-head b { font-size: 13.5px; }
.pp-chips { display: flex; flex-wrap: wrap; gap: 12px 10px; }

.pp-chip .c { height: 44px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(127,127,127,.25); }
.pp-div { width: 1px; align-self: stretch; background: var(--line-2); margin: 0 4px 18px; }
.pp-chip .hx { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rm-sec { display: grid; gap: 14px; }
.rm-sec > h3.rm-h { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 10px; }
.rm-ratio { display: flex; height: 14px; border-radius: 999px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line-2); }
.rm-ratio i { display: block; }
.rm-kv { display: grid; grid-template-columns: minmax(120px, 190px) 1fr; gap: 8px 16px; font-size: 13px; margin: 0; }
.rm-kv dt { font-weight: 600; } .rm-kv dd { margin: 0; color: var(--muted); }
@media (max-width: 640px) { .rm-kv { grid-template-columns: 1fr; gap: 2px; } .rm-kv dd { margin-bottom: 8px; } }
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.tpl .art { background: #fff; border: 1px solid #E3E8F0; border-radius: 8px; display: grid; place-items: center; height: 200px; padding: 10px; overflow: hidden; }
.tpl .art svg { max-height: 180px; max-width: 100%; width: auto; height: auto; box-shadow: 0 0 0 1px #E3E8F0; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 13px; }
.rules li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; }

.rules .dont { color: var(--bad); font-weight: 700; }
.words td:first-child { font-weight: 600; white-space: nowrap; }
.fact-src { font-size: 11px; color: var(--muted); }
.quote { font-size: 20px; font-weight: 600; line-height: 1.35; }

/* Dialogs & drawer */
dialog { border: 0; padding: 0; border-radius: 16px; width: min(720px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); background: var(--card); color: var(--fg); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(5, 10, 20, .5); }
dialog.drawer { margin: 0 0 0 auto; height: 100dvh; max-height: 100dvh; width: min(620px, 100vw); border-radius: 16px 0 0 16px; }
/* The dialog is a column and the form fills it. (A "height: 100%" form inside an auto-height dialog collapses to 0 in Safari.) */
dialog[open] { display: flex; flex-direction: column; }
.dlg { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; flex: 1 1 auto; min-height: 0; max-height: calc(100dvh - 24px); }
dialog.drawer .dlg { max-height: 100dvh; }
.dlg-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.dlg-head h2 { font-size: 18px; font-weight: 700; }
.dlg-body { padding: 18px 20px; overflow-y: auto; display: grid; gap: 18px; align-content: start; }
.dlg-foot { padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.x { appearance: none; border: 0; background: var(--card-2); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; flex: none; color: var(--fg); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
.field { display: grid; gap: 6px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label, .lbl { font-size: 12px; font-weight: 600; }
.hint { font-size: 12px; color: var(--muted); }
.err { color: var(--bad); font-size: 12.5px; font-weight: 500; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 7px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: break-word; }
.history { display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); }

.notice { border-radius: var(--radius); padding: 12px 14px; background: var(--warn-soft); color: var(--warn); font-size: 13px; font-weight: 500; }
/* Sign-in: form on the left (theme-aware), fixed brand visual on the right */
.login { position: fixed; inset: 0; z-index: 100; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); grid-template-rows: minmax(0, 1fr) auto; background: var(--card); overflow-y: auto; }

.lg-card { align-self: center; justify-self: center; width: min(430px, 100%); display: grid; gap: 18px; }
.lg-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }

.lg-pitch { position: relative; max-width: 470px; display: grid; gap: 12px; }

.lg-float { --card-2: #EEF2F8; --fg: #0B0F17; --bar-ok: #049769; background: #fff; color: #0B0F17; border: 1px solid #E3E8F0; border-radius: 16px; padding: 18px 20px; box-shadow: 0 2px 4px rgba(10, 20, 40, .04), 0 18px 40px rgba(10, 20, 40, .12); display: grid; gap: 10px; }

.tour-card .bar { height: 4px; border-radius: 999px; background: #1F2635; overflow: hidden; } .tour-card .bar i { display: block; height: 100%; background: linear-gradient(90deg, #005DFF, #1DC797); }

ooter);\n      color: var(--black);\n    }\n    .footer a {\n      font-size: 11pt;\n      color: var(--blue);\n      text-decoration: underline;\n    }\n\n    /* ---------- Responsive (phones) ---------- */\n    @media screen and (max-width: 600px) {\n      .page {\n        width: 100%;\n        min-height: 100vh;\n        margin: 0;\n        padding: 46mm 16px 96px;\n        box-shadow: none;\n      }\n      .brand-logo { left: 16px; width: 40mm; }\n      .accent--blue-line { display: none; }   /* would run behind the text on narrow screens */\n      .accent--green-dash { left: 20mm; }\n      .page-title { font-size: 20pt; }\n      .body-text { font-size: 11pt; }\n      .footer {\n        left: 16px;\n        right: 16px;\n        bottom: 20px;\n        flex-direction: column;\n        gap: 6px;\n      }\n    }\n\n    /* ---------- Print / Save as PDF (A4, no margins) ---------- */\n    @page {\n      size: A4;\n      margin: 0;\n    }\n    @media print {\n      html, body { background: var(--white); }\n      .page {\n        margin: 0;\n        box-shadow: none;\n        width: 210mm;\n        height: 297mm;\n        min-height: 0;\n        page-break-after: avoid;\n      }\n      .accent, .brand-logo, .footer {\n        -webkit-print-color-adjust: exact;\n        print-color-adjust: exact;\n      }\n    }\n  </style>\n</head>\n<body>\n\n  <!-- A4 document page -->\n  <main class=\"page\">\n\n    <!-- Logo and cover accents, placed as on the PDF cover -->\n    <img class=\"brand-logo\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA30AAAFLCAYAAABiNuUgAAAACXBIWXMAAA7EAAAOxAGVKw4bAAABZGlDQ1BJQ0NCYXNlZChSR0IsR29vZ2xlL1NraWEvN0M1RkEyMTUxMzk3NDc0QTA0ODZCQkNDODM3MzNENTkpAAB4nH2QvUrDYBSGH2tBFMVBhw4OGRxc1P5of8ClrVhcW4VWpzRNi9ifkKboBejm4OomLt6A6GUoCA7i4CWIoLNvGiQFqefw5nt485Iv50Akhioah07Xc8ulglGtHRhT70yoh2VafYfxpdT3S5B9Xv0nN66mG3bf0vkhea4u1ycb4sVWwKc+1wO+8PnEczzxtc/uXrkovhOvtEa4PsKW4/r5N/FWpz2wwv9m1u7uV3RWpSVK9NQt2tisU+GYI0xRhiKb7JAnSUKUIEVO7sZQeeJ6ZklTUBfVWb3PSCm2lc   /** Copy check: hits [{r, sev, quote, msg}] for a text, for one format and audience. */
  function checkCopy(text, opts) {
    const out = []; opts = opts || {};
    if (!text || !String(text).trim()) return out;
    text = String(text);
    const applies = (id) => !opts.format || ruleById[id].f.indexOf(opts.format) >= 0;
