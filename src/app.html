<title>Brand Astra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: brand-black sidebar (always dark) beside a light work area; dark mode softens the work area to slate, never pure black. Cards, tables and a right-side review drawer. */
:root {
  --font: "Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --bg: #F4F6FA; --card: #FFFFFF; --card-2: #F0F3F8; --line: #E3E8F0; --line-2: #D5DCE7;
  --fg: #0B0F17; --muted: #5A6477; --faint: #8C95A6;
  --accent: #005DFF; --accent-soft: #E6EEFF; --accent-ink: #FFFFFF;
  --side: #0A0D14; --side-2: #141A26; --side-fg: #E9EDF4; --side-muted: #8D97AA; --side-line: #1D2432;
  --ok: #047A55; --ok-soft: #DFF6EE; --warn: #9A5B00; --warn-soft: #FFF1D6; --bad: #C42838; --bad-soft: #FFE5E8; --info: #0049CC; --info-soft: #E5EDFF;
  --bar-ok: #049769; --bar-warn: #E59A1A; --bar-bad: #E0475A; --bar-info: #567DE8;
  --shadow: 0 1px 2px rgba(10, 20, 40, .05), 0 6px 20px rgba(10, 20, 40, .05);
  --radius: 12px;
}
:root[data-ui="dark"] {
  --bg: #121823; --card: #1A2230; --card-2: #212A3A; --line: #2A3446; --line-2: #354154;
  --fg: #EDF1F7; --muted: #9DA7B9; --faint: #6F7A8E;
  --accent: #4D8BFF; --accent-soft: #1A2B4D; --accent-ink: #FFFFFF;
  --side: #0A0D14; --side-2: #151B27; --side-fg: #E9EDF4; --side-muted: #8D97AA; --side-line: #1F2635;
  --ok: #3FD6A6; --ok-soft: #13332B; --warn: #FFB846; --warn-soft: #35290F; --bad: #FF7A88; --bad-soft: #3A1A20; --info: #86AEFF; --info-soft: #1A2B4D;
  --bar-ok: #1DC797; --bar-warn: #F2AE3D; --bar-bad: #F2667A; --bar-info: #6E91F0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--side); }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tnum { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* Shell */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-fg); position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100dvh - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 18px; padding: 20px 14px calc(16px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); overflow-y: auto; z-index: 20; }
.brand { display: grid; gap: 12px; padding: 0 2px 4px; }
.brand .plate { background: #fff; border-radius: 12px; padding: 12px 14px; display: grid; place-items: start; }
.brand .plate img { width: 150px; height: auto; display: block; }
.brand .prod { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 8px; }
.brand .prod b { font-size: 15px; font-weight: 400; color: var(--side-fg); } .brand .prod b strong { font-weight: 700; }
.brand .prod small { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--side-muted); }
.nav { display: grid; gap: 2px; }
.nav-label { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--side-muted); padding: 8px 10px 4px; }
.nav button { appearance: none; border: 0; background: none; color: var(--side-fg); display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; cursor: pointer; text-align: left; font-weight: 500; font-size: 13.5px; opacity: .82; }
.nav button svg { width: 18px; height: 18px; flex: none; }
.nav button:hover { background: var(--side-2); opacity: 1; }
.nav button[aria-current="page"] { background: var(--side-2); opacity: 1; box-shadow: inset 3px 0 0 #1DC797; }
.nav .n { margin-left: auto; font-size: 11px; font-weight: 600; background: #1DC797; color: #00261B; border-radius: 999px; padding: 0 7px; min-width: 20px; text-align: center; }
.nav .n.muted { background: var(--side-line); color: var(--side-fg); }
.due-list { display: grid; gap: 2px; }
.due-list button { appearance: none; border: 0; background: none; color: var(--side-fg); display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 12.5px; }
.due-list button:hover { background: var(--side-2); }
.due-list .dot { width: 8px; height: 8px; border-radius: 50%; }
.due-list .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .9; }
.due-list .d { color: var(--side-muted); font-size: 11.5px; }
.side-foot { margin-top: auto; display: grid; gap: 10px; border-top: 1px solid var(--side-line); padding-top: 14px; }
.me { display: flex; align-items: center; gap: 10px; padding: 0 6px; min-width: 0; }
.me img { width: 32px; height: 32px; border-radius: 50%; flex: none; }
.me .nm { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me .rl { font-size: 11.5px; color: var(--side-muted); }
.me-acts { display: flex; gap: 10px; margin-top: 2px; }
.me-acts .linkbtn { font-size: 11px; color: var(--side-muted); padding: 0; }
.me-acts .linkbtn:hover { color: #fff; }
.lg-roles { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
.lg-access { display: grid; gap: 6px; padding: 12px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--fg); font-size: 13px; }
.lg-access[hidden] { display: none; }
.lg-access .btn { justify-self: start; }
.team-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.team-row:first-child { border-top: 0; }
.team-row img { width: 34px; height: 34px; border-radius: 50%; }
.team-row .who { min-width: 0; display: grid; }
.team-row .who b, .team-row .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team-row .who span { font-size: 12.5px; color: var(--muted); }
.palette-strip { display: flex; gap: 4px; padding: 0 6px; }
.palette-strip span { flex: 1; height: 6px; border-radius: 2px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px; padding-block: 12px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.top h1 { font-size: 18px; font-weight: 600; }
.crumb { font-size: 12px; color: var(--muted); }
.spacer { flex: 1; }
.icon-btn { appearance: none; border: 1px solid var(--line); background: var(--card); width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; cursor: pointer; color: var(--fg); flex: none; }
.icon-btn svg { width: 18px; height: 18px; }
.bell { position: relative; }
.bell .badge { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--bg); }
.bell .badge[hidden] { display: none; }
.notif-panel { position: fixed; top: 62px; right: max(16px, env(safe-area-inset-right, 0px)); width: min(390px, calc(100vw - 32px)); max-height: min(72vh, 580px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 14px 44px rgba(10, 20, 40, .2); z-index: 40; display: grid; align-content: start; }
.notif-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 1; }
.notif { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 10px; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line); text-align: left; background: none; font: inherit; color: var(--fg); cursor: pointer; width: 100%; }
.notif:hover, .notif:focus-visible { background: var(--card-2); outline: none; }
.notif.unread { background: var(--accent-soft); }
.notif b { display: block; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.notif .small { display: block; overflow-wrap: anywhere; }
.notif .when { display: block; font-size: 11px; color: var(--faint); margin-top: 2px; }
.notif i { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--faint); }
.notif i.k-ok { background: var(--ok); } .notif i.k-warn { background: var(--bar-warn); } .notif i.k-bad, .notif i.k-due { background: var(--bad); }
.notif i.k-msg { background: var(--accent); } .notif i.k-task { background: var(--info); }
.print-only { display: none; }
@media print {
  #side, .top, .demobar, .no-print, .tour-card, .toast, .scrim { display: none !important; }
  .print-only { display: block; }
  body { background: #fff; }
  .card, .table-wrap { box-shadow: none !important; break-inside: avoid; }
}
.notif-empty { padding: 28px 18px; text-align: center; color: var(--muted); font-size: 13px; }
.menu-btn { display: none; }
.view { padding-block: 22px 64px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; align-content: start; max-width: 1360px; width: 100%; }
.demobar { background: var(--accent-soft); color: var(--fg); font-size: 12.5px; }
.demobar .in { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; padding-block: 8px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; width: 272px; height: 100dvh; padding-top: calc(20px + env(safe-area-inset-top, 0px)); transform: translateX(-102%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.4); }
  .side.open { transform: none; }
  .menu-btn { display: grid; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 15; }
  .top-in, .view, .demobar .in { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top .crumb { display: none; }
}

/* Buttons & pills */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 9px; padding: 9px 15px; font-weight: 600; font-size: 13px; cursor: pointer; border: 1px solid transparent; text-decoration: none; white-space: nowrap; }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-dark { background: var(--fg); color: var(--bg); }
.btn-ghost { background: var(--card); border-color: var(--line); color: var(--fg); }
.btn-ghost:hover { background: var(--card-2); }
.btn-ok { background: var(--ok); color: var(--card); }
.btn-warn { background: var(--warn-soft); color: var(--warn); border-color: currentColor; }
.btn-bad { background: var(--bad-soft); color: var(--bad); border-color: currentColor; }
.btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.linkbtn { appearance: none; background: none; border: 0; padding: 0; color: var(--accent); font-weight: 500; cursor: pointer; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-awaiting, .st-resubmitted, .st-inreview, .rq-ontrack { color: var(--info); background: var(--info-soft); }
.st-approved { color: var(--ok); background: var(--ok-soft); }
.st-changes, .rq-soon { color: var(--warn); background: var(--warn-soft); }
.st-rejected, .rq-overdue { color: var(--bad); background: var(--bad-soft); }
.rq-closed { color: var(--muted); background: var(--card-2); }
.tag { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.late { color: var(--bad); font-weight: 600; }
.ontime { color: var(--ok); font-weight: 600; }
.muted { color: var(--muted); }
.chip { display: inline-flex; gap: 5px; align-items: center; font-size: 11.5px; padding: 2px 8px; border-radius: 6px; font-weight: 500; }
.chip.fail { background: var(--bad-soft); color: var(--bad); }
.chip.minor { background: var(--warn-soft); color: var(--warn); }
.chip.pass { background: var(--ok-soft); color: var(--ok); }

/* Cards & grids */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-head h3 { font-size: 14.5px; font-weight: 600; }
.card-head .sub { font-size: 12px; color: var(--muted); }
.page-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head h2 { font-size: 24px; font-weight: 700; }
.page-head h2 b { font-weight: 700; }
.page-head h2 span { font-weight: 400; }
.page-head p { color: var(--muted); max-width: 70ch; margin-top: 4px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid-main { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 1180px) { .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-main { grid-template-columns: minmax(0, 1fr); } .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .grid-4, .grid-3, .grid-2 { grid-template-columns: minmax(0, 1fr); } }

.kpi { display: grid; gap: 6px; }
.kpi .l { font-size: 12.5px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 8px; }
.kpi .l i { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-style: normal; }
.kpi .l i svg { width: 15px; height: 15px; }
.kpi .v { font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 14px; font-weight: 500; color: var(--muted); }
.kpi .d { font-size: 12px; color: var(--muted); }
.kpi .d b { font-weight: 600; }
.up { color: var(--ok); } .down { color: var(--bad); }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
table { width: 100%; border-collapse: collapse; min-width: 720px; }
th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 11px 14px; border-bottom: 1px solid var(--line); background: var(--card-2); white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13px; }
tr:last-child td { border-bottom: 0; }
td.tnum { white-space: nowrap; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--card-2); }
.person { display: flex; align-items: center; gap: 10px; min-width: 0; }
.person img { width: 30px; height: 30px; border-radius: 50%; flex: none; }
.person .nm { font-weight: 600; }
.small { font-size: 11.5px; color: var(--muted); }
.progress { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; min-width: 120px; }
.progress .track { height: 6px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
.progress .fill { height: 100%; border-radius: 999px; background: var(--bar-ok); }
.score { display: inline-grid; place-items: center; min-width: 40px; padding: 2px 8px; border-radius: 7px; font-weight: 700; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.score.hi { background: var(--ok-soft); color: var(--ok); }
.score.mid { background: var(--warn-soft); color: var(--warn); }
.score.lo { background: var(--bad-soft); color: var(--bad); }
.score.na { background: var(--card-2); color: var(--muted); font-weight: 500; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar .grow { flex: 1 1 220px; }
.field-in { width: 100%; border: 1px solid var(--line-2); background: var(--card); border-radius: 9px; padding: 9px 12px; }
select.field-in { width: auto; }
textarea.field-in { resize: vertical; min-height: 90px; }
.seg { display: inline-flex; background: var(--card-2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { appearance: none; border: 0; background: none; padding: 6px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: var(--shadow); font-weight: 600; }

/* Request cards (portfolio grid) */
.req-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 12px; align-items: start; overflow-x: auto; padding-bottom: 4px; }
.col { background: var(--card-2); border-radius: 12px; padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 160px; transition: outline-color .15s; outline: 2px dashed transparent; outline-offset: -2px; }
.col.over { outline-color: var(--accent); }
.col-head { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; font-weight: 600; padding: 2px 4px; }
.col-head .n { color: var(--muted); font-weight: 500; }
.col-empty { font-size: 12px; color: var(--faint); padding: 14px 6px; text-align: center; border: 1px dashed var(--line-2); border-radius: 9px; }
.tcard { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; font-size: 12.5px; box-shadow: var(--shadow); cursor: pointer; min-width: 0; }
.tcard[draggable="true"] { cursor: grab; }
.tcard.dragging { opacity: .5; }
.tcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tcard h5 { font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }
.tcard .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-width: 0; }
.prio { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; text-transform: uppercase; letter-spacing: .05em; }
.prio.high { background: var(--bad-soft); color: var(--bad); }
.prio.normal { background: var(--card-2); color: var(--muted); }
.prio.low { background: var(--info-soft); color: var(--info); }
.mini-select { font: inherit; font-size: 11.5px; padding: 3px 6px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cal .dow { background: var(--card-2); font-size: 11px; font-weight: 600; color: var(--muted); padding: 6px 8px; }
.cal .day { background: var(--card); min-height: 96px; padding: 6px; display: grid; gap: 4px; align-content: start; font-size: 11.5px; min-width: 0; }
.cal .day.out { background: var(--card-2); color: var(--faint); }
.cal .day .dn { justify-self: start; font-weight: 600; padding: 0 6px; border-radius: 999px; }
.cal .day.today .dn { background: var(--accent); color: var(--accent-ink); }
.ev { display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--accent); border-radius: 5px; padding: 3px 6px; font: inherit; font-size: 11px; font-weight: 500; background: var(--accent-soft); color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.ev.high { border-left-color: var(--bad); background: var(--bad-soft); }
.ev.low { border-left-color: var(--faint); background: var(--card-2); }
.ev.done { opacity: .55; text-decoration: line-through; }
.cal-agenda { display: none; gap: 6px; }
.agenda-row { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; align-items: center; }
@media (max-width: 760px) { .cal { display: none; } .cal-agenda { display: grid; } .board { grid-template-columns: repeat(4, minmax(240px, 82vw)); scroll-snap-type: x mandatory; } .col { scroll-snap-align: start; } }

.qc-rules { display: grid; gap: 8px; }

.chip.sev-critical { background: var(--bad); color: #fff; }

.ok-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--ok); color: var(--card); display: grid; place-items: center; flex: none; } .ok-dot svg { width: 16px; height: 16px; }

/* Charts */

.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }

/* Brand QC */

@media (max-width: 1100px) { .qc-layout { grid-template-columns: minmax(0, 1fr); } }

/* Scorecard */
.sc { display: grid; gap: 8px; }
.sc-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 9px; background: var(--card-2); }

.sc-row .seg button[data-v="fail"][aria-pressed="true"] { color: var(--bad); }

/* Brand kit */

/* Dialogs & drawer */
dialog { border: 0; padding: 0; border-radius: 16px; width: min(720px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); background: var(--card); color: var(--fg); box-shadow: 0 30px 80px rgba(0,0,0,.35); }

/* Sign-in: form on the left (theme-aware), fixed brand visual on the right */

.lg-logo { width: 176px; height: auto; display: block; background: #fff; border-radius: 10px; box-sizing: content-box; }

.lg-float .aa { font-size: 30px; font-weight: 700; line-height: 1; }
.lg-float.f1 { transform: translateY(18px) rotate(-1.5deg); }
.lg-float.f2 { transform: translateY(-10px) rotate(1.2deg); align-self: start; }
.lg-float.f3 { transform: translateY(6px) rotate(1deg); }
.lg-float.f4 { transform: translateY(-18px) rotate(-1deg); }
@media (max-width: 920px) { .login { grid-template-columns: minmax(0, 1fr); } .lg-right { display: none; } .lg-left { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); } .lg-card h1 { font-size: 28px; } }
@media (max-width: 640px) {
  #submit-top span { display: none; } #submit-top { padding: 9px 11px; }
  .top-in > div:not(.spacer) { flex: 1 1 auto; } .top h1 { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .demobar .hint { display: none; } .demobar .in { gap: 6px; } .demobar .btn-sm { padding: 5px 9px; font-size: 11.5px; }
  .page-head h2 { font-size: 21px; }
}
.tour-card { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 90; width: min(400px, calc(100vw - 32px)); background: #0A0D14; color: #E9EDF4; border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.45); padding: 18px 18px 14px; display: grid; gap: 10px; }
.tour-card .tk { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #8FB0FF; font-weight: 600; display: flex; justify-content: space-between; }
.tour-card h3 { font-size: 17px; font-weight: 700; color: #fff; }
.tour-card .say { font-size: 13.5px; line-height: 1.55; color: #E9EDF4; }
.tour-card .say-l { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #1DC797; font-weight: 600; }
.tour-card .note { font-size: 12px; color: #9DA7B9; }
.tour-card .bar { height: 4px; border-radius: 999px; background: #1F2635; overflow: hidden; } .tour-card .bar i { display: block; height: 100%; background: linear-gradient(90deg, #005DFF, #1DC797); }
.tour-card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tour-card .btn-ghost { background: transparent; color: #E9EDF4; border-color: #2A3446; }
.tour-hl { outline: 3px solid #1DC797 !important; outline-offset: 4px; border-radius: 12px; box-shadow: 0 0 0 6px rgba(29, 199, 151, .18) !important; transition: outline-color .2s; }
.btn-tour { background: linear-gradient(90deg, #005DFF, #1DC797); color: #fff; }
@media (max-width: 700px) { .tour-card { right: 8px; left: 8px; width: auto; bottom: 8px; } }
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }
</style>

    const listen = (l) => { listeners.push(l); setTimeout(() => l.fn(l.doc ? snapDoc(l.doc) : snapCol(l.col)), 0); return () => { listeners = listeners.filter((x) => x !== l); }; };
    async function reload() { state = await gs("getState"); applyPeople(state); fire(); }
    const writeOp = (p, op) => async (d) => { await gs("write", p, op, d ? clone(d) : null); await reload(); };
    const docRef = (p) => ({ id: p.split("/").pop(), path: p, get: async () => snapDoc(p), set: writeOp(p, "set"), update: writeOp(p, "update"), delete: () => writeOp(p, "delete")(), onSnapshot: (fn) => listen({ doc: p, fn }) });
    return { doc: docRef, collection: (c) => ({ path: c, doc: (id) => docRef(c + "/" + (id || newId())), onSnapshot: (fn) => listen({ col: c, fn }) }), reload };
  }
  function applyPeople(st) {
    for (const [email, p] of Object.entries(st.people || {})) S.profiles[email] = { id: email, name: p.name || "", team: p.team || "", avatarUrl: avatarOf(email, p.name), email, lastSeen: p.lastSeen || "" };
    if (st.team) S.team = st.team;
  }
  function fatalScreen(msg, appUrl) {
    $("#view").replaceChildren(h("div", { class: "empty" }, h("strong", { text: "You can't open Brand Astra with this account" }), h("span", { text: msg }),
      appUrl ? h("a", { class: "btn btn-dark btn-sm", href: "https://accounts.google.com/AccountChooser?continue=" + encodeURIComponent(appUrl), target: "_top" }, "Switch Google account") : null));
  }
  const blobDownloads = { save: async ({ filename, data }) => {
    const type = filename.endsWith(".csv") ? "text/csv" : filename.endsWith(".svg") ? "image/svg+xml" : "application/octet-stream";
    const url = URL.createObjectURL(new Blob([data], { type })); const a = h("a", { href: url, download: filename }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  } };
  /** The sign-in page: Google has already verified the @recykal.com account; the person confirms it and picks how to sign in. */
  async function signIn(st) {
    const p = await loginScreen({ email: st.me.email, name: st.me.name, team: st.me.team, isAdmin: st.me.isAdmin, isNew: st.me.isNew, avatarUrl: avatarOf(st.me.email, st.me.name), roles: true,
      switchUrl: window.BA && BA.switchUrl ? BA.switchUrl : st.appUrl ? "https://accounts.google.com/AccountChooser?continue=" + encodeURIComponent(st.appUrl) : null, onSave: (n, t) => gs("saveProfile", n, t), onRequest: () => gs("requestMarketingAccess") });
    st.me.name = p.name; st.me.team = p.team; st.me.isNew = false; st.people[st.me.email] = Object.assign({}, st.people[st.me.email], { name: p.name, team: p.team, lastSeen: new Date().toISOString() });
    return p;
  }
  /** Sign out of Brand Astra (the Google account stays signed in): back to the sign-in page. */
  async function signOut() {
    try { sessionStorage.removeItem("ba.in"); sessionStorage.removeItem("ba.role"); } catch (e) {}
    if (window.BA && BA.signOutUrl) { location.href = BA.signOutUrl; return; }        // our own server: end the session there too
    const dlg = $("#dlg"); if (dlg.open) dlg.close();
    const st = { me: { email: S.me.email, name: S.me.name, team: S.me.team, isAdmin: S.realAdmin, isNew: false }, people: {}, appUrl: S.appUrl };
    const p = await signIn(st);
    S.me.name = p.name; S.isAdmin = S.realAdmin && p.role !== "employee"; S.view = "overview"; render(); window.scrollTo(0, 0);
  }
  function switchRole() {
    S.isAdmin = !S.isAdmin; try { sessionStorage.setItem("ba.role", S.isAdmin ? "marketing" : "employee"); } catch (e) {}
    S.view = "overview"; render(); window.scrollTo(0, 0); toast(S.isAdmin ? "Marketing team view" : "Employee view: what your colleagues see");
  }
  async function bootApps() {
    let st;
    try { st = await gs("getState"); } catch (e) { S.ready = false; fatalScreen(e.message, null); return; }
    if (st.me.isNew || !signedInThisSession()) await signIn(st);
    applyPeople(st);
    S.db = makeAppsDb(st);
    S.user = { profiles: async (ids) => Object.fromEntries([].concat(ids).map((i) => [i, S.profiles[i] || { id: i, name: "", avatarUrl: avatarOf(i, ""), email: null }])) };
    S.uid = st.me.email; S.realAdmin = !!st.me.isAdmin; S.isAdmin = S.realAdmin && sessionRole() !== "employee"; S.sheetUrl = st.sheetUrl; S.appUrl = st.appUrl;
    S.me = { id: st.me.email, name: st.me.name, team: st.me.team, avatarUrl: avatarOf(st.me.email, st.me.name), email: st.me.email };
    S.downloads = blobDownloads;
    // The check runs here in the browser; the server only fetches a linked file (Slides and Docs as PDF) and saves the result.
    const fetchFile = async (link, onStage) => { onStage && onStage("Fetching your file from Google Drive"); return b64File(await gs("fileForQc", link)); };
    S.autoQc = {
      review: async (uid, sid, onStage) => {
        const sub = await subOf(uid, sid);
        const file = FILES[sub.link] || await fetchFile(sub.link, onStage);
        const res = await checkFile(file, sub.format, sub.copy, onStage, sub.audience, sub.title);
        const r = await gs("saveAutoCheck", uid, sid, res.report); await S.db.reload(); return r;
      },
      preview: async (link, fmt, copy, title, file, onStage, audience) => checkFile(file || await fetchFile(link, onStage), fmt, copy, onStage, audience, title),
      upload: (file) => new Promise((resolve, reject) => { const rd = new FileReader(); rd.onerror = () => reject(new Error("Couldn't read that file."));
        const mime = file.type || (/\.pdf$/i.test(file.name) ? "application/pdf" : /\.pptx$/i.test(file.name) ? "application/vnd.openxmlformats-officedocument.presentationml.presentation" : "");
        rd.onload = () => gs("uploadForQc", file.name, mime, String(rd.result).split(",")[1]).then(resolve, reject); rd.readAsDataURL(file); }),
    };
    if (!S.isAdmin && (S.view === "queue" || S.view === "reports")) S.view = "overview";
    subscribe(); S.ready = true; render();
    setInterval(() => { if (document.visibilityState === "visible" && !$("#dlg").open) S.db.reload().catch(() => {}); }, 60000);
  }


  // ---------- theme & shell wiring ----------
  function applyTheme(t) {
    document.documentElement.setAttribute("data-ui", t);
    const b = $("#theme"); b.replaceChildren(icon(t === "dark" ? "sun" : "moon"));
    b.setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode");
  }
  let theme = "light";
  try { theme = localStorage.getItem("bc.theme") || (document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light"); } catch (e) {}
  applyTheme(theme);
  $("#bell").addEventListener("click", () => notifOpen ? closeNotif() : openNotif());
  $("#theme").addEventListener("click", () => { theme = theme === "dark" ? "light" : "dark"; applyTheme(theme); try { localStorage.setItem("bc.theme", theme); } catch (e) {} });
  $("#menu").addEventListener("click", () => { $("#side").classList.add("open"); const sc = h("div", { class: "scrim", onclick: () => { $("#side").classList.remove("open"); sc.remove(); } }); document.body.append(sc); });
  $("#submit-top").addEventListener("click", () => openSubmit(S.view === "qc" ? { fromQc: true } : {}));
  const LOGO_URI = $("#logo-img").src;
  $("#dlg").addEventListener("click", (e) => { if (e.target.id === "dlg") e.target.close(); });
  render();
  boot().catch((e) => { console.error(e); S.noDb = true; S.ready = true; render(); });
})();
</script>
